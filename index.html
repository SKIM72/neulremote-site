<script>
(function () {
  var langs = ["en","ko","ja"], pick = null;
  try { pick = localStorage.getItem("neulremote.site.lang"); } catch (e) {}
  if (langs.indexOf(pick) < 0) {
    var prefs = navigator.languages || [navigator.language || "en"];
    for (var i = 0; i < prefs.length && !pick; i++) { var l = String(prefs[i]).slice(0, 2).toLowerCase(); if (langs.indexOf(l) >= 0) pick = l; }
  }
  location.replace((pick || "en") + "/" + location.hash);
})();
</script>
